name: pages

# Publishes the site to GitHub Pages from main. The artifact holds only the site: the vendored
# hallmark skill (.claude/), its lint log (.hallmark/) and this workflow stay out of the published
# tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '.hallmark' \
                   --exclude '.gitignore' --exclude '_site' --exclude 'node_modules' ./ _site/
          touch _site/.nojekyll
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
